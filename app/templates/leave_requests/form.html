{% extends "base.html" %}
{% block title %}Request Leave{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Request Leave</h1>
  </div>

  <div class="card">
    <form method="post" class="stacked">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="leave_type_id">Leave Type</label>
      <select id="leave_type_id" name="leave_type_id" required>
        <option value="" disabled selected>Select a leave type</option>
        {% for lt in leave_types %}
        <option value="{{ lt.id }}">{{ lt.name }} ({{ lt.annual_quota }} days/yr)</option>
        {% endfor %}
      </select>

      <label for="start_date">Start Date</label>
      <input type="date" id="start_date" name="start_date" required>

      <label for="end_date">End Date</label>
      <input type="date" id="end_date" name="end_date" required>

      <label for="reason">Reason</label>
      <textarea id="reason" name="reason" rows="3"></textarea>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="{{ url_for('leave_requests.list_my_requests') }}" class="btn-text">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
