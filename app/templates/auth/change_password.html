{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
  <div class="page-header"><h1>Change password</h1></div>
  <div class="card"><form method="post" class="stacked"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="text-muted">Use a password with at least 8 characters. You will remain signed in after changing it.</p>
    <label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" required>
    <label for="new_password">New password</label><input type="password" id="new_password" name="new_password" minlength="8" required>
    <label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Update password</button><a href="{{ url_for('dashboard.home') }}" class="btn-text">Cancel</a></div>
  </form></div>
{% endblock %}
