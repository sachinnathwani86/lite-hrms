{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
  <div class="setup-wrap">
    <div class="login-card">
      <p class="form-kicker">Account recovery</p>
      <h2>Forgot your password?</h2>
      <p class="subtitle">Enter your work email and we&rsquo;ll send you a link to choose a new password.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <button type="submit" class="btn btn-primary">Send reset link</button>
        <p class="login-link"><a href="{{ url_for('auth.login') }}" class="btn-text">Back to sign in</a></p>
      </form>
    </div>
  </div>
{% endblock %}
