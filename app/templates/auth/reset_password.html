{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <div class="setup-wrap">
    <div class="login-card">
      <p class="form-kicker">Account recovery</p>
      <h2>Choose a new password</h2>
      <p class="subtitle">Use a password with at least 8 characters.</p>
      <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required autofocus>
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
        <button type="submit" class="btn btn-primary">Reset password</button>
      </form>
    </div>
  </div>
{% endblock %}
