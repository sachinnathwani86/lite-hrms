{% extends "base.html" %}
{% block title %}Payslip — {{ employee.full_name }}{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>Payslip — {{ employee.full_name }}</h1>
    <a href="{{ url_for('employees.list_employees') }}" class="btn-text">&larr; Back to Employees</a>
  </div>

  <div class="card">
    <form method="post" class="stacked">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="month">Month</label>
      <select id="month" name="month">
        {% for m in range(1, 13) %}
        <option value="{{ m }}" {{ "selected" if m == today.month else "" }}>{{ m }}</option>
        {% endfor %}
      </select>

      <label for="year">Year</label>
      <input type="number" id="year" name="year" value="{{ today.year }}" required>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Download Payslip</button>
      </div>
    </form>
  </div>
{% endblock %}
