{% extends "base.html" %}
{% block title %}{{ "Edit" if leave_type else "New" }} Leave Type{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>{{ "Edit" if leave_type else "New" }} Leave Type</h1>
  </div>

  <div class="card">
    <form method="post" class="stacked">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ leave_type.name if leave_type else '' }}" required>

      <label for="annual_quota">Annual Quota (days)</label>
      <input type="number" step="0.5" id="annual_quota" name="annual_quota"
             value="{{ leave_type.annual_quota if leave_type else 0 }}" required>

      <label for="accrual_type">Accrual Type</label>
      <select id="accrual_type" name="accrual_type">
        {% for opt in ["yearly_upfront", "monthly", "none"] %}
        <option value="{{ opt }}" {{ "selected" if leave_type and leave_type.accrual_type == opt else "" }}>{{ opt }}</option>
        {% endfor %}
      </select>

      <div class="checkbox-row">
        <input type="checkbox" id="carry_forward" name="carry_forward"
               {{ "checked" if leave_type and leave_type.carry_forward else "" }}>
        <label for="carry_forward">Allow carry-forward to next year</label>
      </div>

      <label for="max_carry_forward">Max Carry-Forward (days, leave blank if none)</label>
      <input type="number" step="0.5" id="max_carry_forward" name="max_carry_forward"
             value="{{ leave_type.max_carry_forward if leave_type and leave_type.max_carry_forward is not none else '' }}">

      <div class="checkbox-row">
        <input type="checkbox" id="requires_approval" name="requires_approval"
               {{ "checked" if not leave_type or leave_type.requires_approval else "" }}>
        <label for="requires_approval">Requires manager approval</label>
      </div>

      <label for="min_days_notice">Minimum Notice (days)</label>
      <input type="number" id="min_days_notice" name="min_days_notice"
             value="{{ leave_type.min_days_notice if leave_type else 0 }}">

      <div class="checkbox-row">
        <input type="checkbox" id="allow_negative_balance" name="allow_negative_balance"
               {{ "checked" if leave_type and leave_type.allow_negative_balance else "" }}>
        <label for="allow_negative_balance">Allow negative balance</label>
      </div>

      {% if leave_type %}
      <div class="checkbox-row">
        <input type="checkbox" id="is_active" name="is_active"
               {{ "checked" if leave_type.is_active else "" }}>
        <label for="is_active">Active</label>
      </div>
      {% endif %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('leave_types.list_leave_types') }}" class="btn-text">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
