{% extends "base.html" %}
{% block title %}{{ "Edit" if designation else "New" }} Designation{% endblock %}
{% block content %}
  <div class="page-header">
    <h1>{{ "Edit" if designation else "New" }} Designation</h1>
  </div>

  <div class="card">
    <form method="post" class="stacked">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ designation.title if designation else '' }}" required>

      {% if designation %}
      <div class="checkbox-row">
        <input type="checkbox" id="is_active" name="is_active"
               {{ "checked" if designation.is_active else "" }}>
        <label for="is_active">Active</label>
      </div>
      {% endif %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('designations.list_designations') }}" class="btn-text">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
